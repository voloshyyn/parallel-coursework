x-search-image: &search-image
  image: coursework-search:local
  build:
    context: .
    dockerfile: Dockerfile

services:
  server:
    <<: *search-image
    stop_grace_period: 30s
    ports:
      - "${SEARCH_PORT:-8080}:8080"
    environment:
      PORT: "8080"
      DATA_DIR: /data/generated/${DATASET_PROFILE:-full}
      DATASET_PROFILE: ${DATASET_PROFILE:-full}
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:1.5b}
      AUTO_INDEX: "true"
      INDEX_THREADS: ${INDEX_THREADS:-4}
      QUERY_EXPANSION: ${QUERY_EXPANSION:-true}
      SEARCH_WORKERS: ${SEARCH_WORKERS:-4}
      SEARCH_TASK_QUEUE: ${SEARCH_TASK_QUEUE:-64}
      SEARCH_CONNECTION_QUEUE: ${SEARCH_CONNECTION_QUEUE:-4}
    volumes:
      - generated_data:/data/generated
    depends_on:
      ollama:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  ollama:
    image: ollama/ollama:0.40.10
    environment:
      OLLAMA_KEEP_ALIVE: 24h
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_models:/root/.ollama

  model-init:
    <<: *search-image
    entrypoint: ["python3", "/app/tools/prepare_model.py"]
    environment:
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:1.5b}
    depends_on:
      ollama:
        condition: service_started
    restart: on-failure:3

volumes:
  generated_data:
  ollama_models:
